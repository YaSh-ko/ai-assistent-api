version: '3.8'

services:
  api:
    image: api-service-staging:latest
    container_name: staging_api
    restart: unless-stopped
    ports:
      - "8002:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_URI=bolt+ssc://neo4j.delez-repo.ru:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_PRIVATE_KEY_PEM=${JWT_PRIVATE_KEY_PEM}
      - JWT_PUBLIC_KEY_PEM=${JWT_PUBLIC_KEY_PEM}
    networks:
      - philosophy_gitlab_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  philosophy_gitlab_network:
    external: true
